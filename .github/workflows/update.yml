name: Обновление ленты

on:
  schedule:
    - cron: "17 * * * *"   # каждый час (время UTC)
  workflow_dispatch:          # кнопка Run workflow для ручного запуска
  push:
    branches: [main]
    paths-ignore:
      - "site/data/**"

permissions:
  contents: write   # сохранить архив новостей в репозиторий
  pages: write
  id-token: write

concurrency:
  group: rail-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Сбор новостей
        run: python scraper/collect.py

      - name: Сохранение архива
        run: |
          git config user.name "rail-news-bot"
          git config user.email "rail-news-bot@users.noreply.github.com"
          git add site/data/news.json
          if git diff --cached --quiet; then
            echo "Новых новостей нет"
          else
            git commit -m "Лента: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
