# =====================================================================
# Настройки ленты. Всё, что нужно менять, — здесь.
# После правки закоммитьте файл: сайт пересоберётся автоматически.
# =====================================================================

# Сколько дней хранить новости в архиве и максимум записей
keep_days: 45
max_items: 3000

# ---------------------------------------------------------------------
# Тематические запросы к Google News.
# Это основной источник: Google сам собирает публикации сотен СМИ.
# "when:3d" — только материалы за последние 3 дня (архив копится у нас).
# Синтаксис как в обычном поиске Google: кавычки, OR, минус-слова.
# ---------------------------------------------------------------------
google_news:
  ru:
    - '"Средний коридор" OR ТМТМ OR "Транскаспийский маршрут"'
    - 'КТЖ грузоперевозки OR "Қазақстан темір жолы"'
    - 'Казтемиртранс OR КТЖ вагоны'
    - 'Достык OR Алтынколь OR Хоргос железная дорога'
    - 'контейнерные поезда Китай Европа'
    - 'РЖД погрузка OR грузооборот'
    - 'железнодорожные перевозки грузов СНГ'
    - 'порт Актау OR Курык контейнеры'
    - 'Белорусская железная дорога транзит'
    - 'Узбекистанские железные дороги OR "Узбекистон темир йуллари"'
    - 'ж/д тарифы OR ставки полувагонов'
    - 'логистика Центральная Азия'
  en:
    - '"Middle Corridor" rail OR "Trans-Caspian"'
    - 'China Europe rail freight'
    - 'Kazakhstan railway freight'
    - 'Eurasian rail container transit'

# ---------------------------------------------------------------------
# Прямые RSS-ленты отраслевых СМИ.
# filter: true — брать только материалы, где есть ЖД/логистические слова
# (для общих лент). Если какая-то лента перестанет отвечать, это будет
# видно в блоке «Источники» внизу сайта — её можно поправить или удалить.
# ---------------------------------------------------------------------
feeds:
  - name: RailFreight.com
    url: https://www.railfreight.com/feed/
    lang: en
    filter: false
  - name: Гудок
    url: https://gudok.ru/rss/
    lang: ru
    filter: true
  - name: РЖД-Партнёр
    url: https://www.rzd-partner.ru/rss/
    lang: ru
    filter: true
  - name: PortNews
    url: https://portnews.ru/rss/
    lang: ru
    filter: true
  - name: Kursiv
    url: https://kz.kursiv.media/feed/
    lang: ru
    filter: true

# ---------------------------------------------------------------------
# Рубрики. Новость попадает во все рубрики, где нашлось хотя бы одно
# слово. Слова — начала слов в нижнем регистре ("железнодорож" найдёт
# "железнодорожный", "железнодорожные"...). Короткие (до 3 букв)
# ищутся как отдельные слова, как и слова со знаком = в начале
# (=port найдёт "port", но не "portfolio").
# ---------------------------------------------------------------------
