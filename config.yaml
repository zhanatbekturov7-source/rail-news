# =====================================================================
# КТТ Rail-News: настройки ленты. Всё, что нужно менять, — здесь.
# После сохранения файла сайт пересоберётся сам через пару минут.
# =====================================================================

site_title: КТТ Rail-News
keep_days: 45      # сколько дней хранить новости
max_items: 3000    # максимум новостей в архиве

# =====================================================================
# ТЕМЫ. Каждая тема — это раздел в левом меню сайта.
#
# Чтобы ДОБАВИТЬ ТЕМУ, скопируйте любой блок ниже (от "- name:" до
# следующего "- name:"), вставьте в конец списка и поменяйте:
#   name       — название раздела в меню
#   keywords   — слова, по которым новость относится к теме. Пишутся
#                началом слова в нижнем регистре: "вагон" найдёт
#                "вагоны", "вагонного". Короткие (до 3 букв) и слова
#                со знаком = в начале ищутся только целиком.
#   search_ru  — запросы в Google News на русском (по ним собираются
#   search_en    новости) и на английском. Можно не указывать.
#                Синтаксис как в Google: "точная фраза", OR, -слово.
#
# Порядок тем здесь = порядок в меню. Чтобы убрать тему, удалите блок.
# =====================================================================
topics:

  - name: Средний коридор и ТМТМ
    keywords: [средний коридор, среднего коридора, среднему коридору, тмтм, транскаспий, middle corridor, trans-caspian, titr]
    search_ru:
      - '"Средний коридор" OR ТМТМ OR "Транскаспийский маршрут"'
    search_en:
      - '"Middle Corridor" rail OR "Trans-Caspian"'

  - name: Транзит Китай — Европа
    keywords: [транзит, контейнерн, контейнер, дфэ, =teu, хоргос, достык, алтынколь, малашевич, china-europe, china europe, transit, container]
    search_ru:
      - 'контейнерные поезда Китай Европа'
      - 'Достык OR Алтынколь OR Хоргос железная дорога'
    search_en:
      - 'China Europe rail freight'
      - 'Eurasian rail container transit'

  - name: Грузовые перевозки
    keywords: [погрузк, грузооборот, грузоперевоз, перевозк, перевез, объем перевоз, объём перевоз, cargo, freight volume, shipments]
    search_ru:
      - 'КТЖ грузоперевозки OR "Қазақстан темір жолы"'
      - 'РЖД погрузка OR грузооборот'
      - 'железнодорожные перевозки грузов СНГ'
    search_en:
      - 'Kazakhstan railway freight'

  - name: Вагонный парк и подвижной состав
    keywords: [вагон, полуваго, цистерн, фитинг, локомотив, тепловоз, электровоз, подвижн, ремонт вагон, операторы подвижного, казтемиртранс, қазтеміртранс, wagon, rolling stock, locomotive, railcar]
    search_ru:
      - 'Казтемиртранс OR КТЖ вагоны'
      - 'полувагоны OR "вагонный парк" OR вагоностроение'
      - 'операторы подвижного состава ставки'
    search_en:
      - 'rolling stock wagons Kazakhstan OR Uzbekistan OR Russia'

  - name: Порты и Каспий
    keywords: [порт, паром, актау, курык, баку, алят, поти, батуми, каспи, =port, =ports, ferry, caspian]
    search_ru:
      - 'порт Актау OR Курык контейнеры'
      - 'Каспийское море паромы грузы'

  - name: Тарифы и регулирование
    keywords: [тариф, ставк, пошлин, санкци, регулиров, постановлени, законопроект, таможн, индексац, tariff, sanction, customs, regulation]
    search_ru:
      - 'ж/д тарифы OR ставки полувагонов'
      - 'железнодорожные тарифы индексация'

  - name: Инфраструктура и стройка
    keywords: [строительств, вторые пути, новая линия, новой линии, новых линий, электрификац, модерниз, реконструкц, инвест, construction, infrastructure, investment, new line]
    search_ru:
      - 'строительство железной дороги Казахстан OR Узбекистан OR Кыргызстан'
      - 'вторые пути OR "новая железная дорога" Центральная Азия'

  - name: Логистика и терминалы
    keywords: [логист, экспедир, экспедит, склад, терминал, хаб, мультимодал, сухой порт, logistic, terminal, warehouse, hub]
    search_ru:
      - 'логистика Центральная Азия'
      - 'транспортно-логистический центр OR терминал Казахстан'

# Если новость не подошла ни к одной теме, она попадёт сюда
default_topic: Логистика и терминалы

# =====================================================================
# Прямые RSS-ленты отраслевых СМИ. filter: true — брать только
# материалы, где есть хотя бы одно слово из списка relevance ниже.
# =====================================================================
feeds:
  - name: RailFreight.com
    url: https://www.railfreight.com/feed/
    lang: en
    filter: false
  - name: Гудок
    url: https://gudok.ru/rss/
    lang: ru
    filter: true
  - name: РЖД-Партнёр
    url: https://www.rzd-partner.ru/rss/
    lang: ru
    filter: true
  - name: PortNews
    url: https://portnews.ru/rss/
    lang: ru
    filter: true
  - name: Kursiv
    url: https://kz.kursiv.media/feed/
    lang: ru
    filter: true

relevance:
  - железнодорож
  - ж/д
  - жд
  - вагон
  - локомотив
  - поезд
  - ктж
  - ржд
  - бжд
  - контейнер
  - транзит
  - логист
  - грузоперевоз
  - перевозк
  - грузооборот
  - средний коридор
  - тмтм
  - rail
  - freight
  - logistic
  - container

# =====================================================================
# Регионы — станции на схеме маршрутов в шапке сайта.
# Если меняете названия, поправьте и STATIONS в site/index.html.
# =====================================================================
regions:
  Китай: [китай, китая, китае, кнр, китайск, синьцзян, урумчи, сиань, чунцин, china, chinese, xinjiang, "xi'an", xian, chongqing]
  Казахстан: [казахстан, хоргос, khorgos, ктж, қтж, казтемиртранс, қазтеміртранс, достык, алтынколь, актау, курык, астан, алмат, kazakh, kaztemirtrans]
  Центральная Азия: [узбекист, кыргыз, киргиз, туркмен, таджик, ташкент, uzbek, kyrgyz, turkmen, tajik, central asia, центральной азии, центральная азия]
  Каспий и Закавказье: [азербайдж, грузии, грузия, грузинск, баку, алят, поти, батуми, каспи, турци, azerbaijan, georgia, caspian, turkey, türkiye, turkiye]
  Россия: [росси, ржд, москв, russia]
  Беларусь: [беларус, белорус, бжд, брест, малашевич, belarus]
  Европа: [европ, евросоюз, польш, герман, дуйсбург, europe, european, poland, germany, duisburg]
